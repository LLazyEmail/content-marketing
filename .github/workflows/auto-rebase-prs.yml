# Uses the real auto-rebase composite action from documentation-actions.
# See https://github.com/LLazyEmail/documentation-actions/tree/main/actions/auto-rebase
name: Auto-rebase open PRs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# checks + statuses let report-failing-checks name red checks with GITHUB_TOKEN
# (no AUTO_REBASE_TOKEN needed for names). A PAT is still needed if bot-updated
# branches should re-trigger pull_request CI.
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  rebase:
    name: auto-rebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-rebase-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Attempt to update branches of open PRs
        uses: LLazyEmail/documentation-actions/actions/auto-rebase@main
        with:
          comment-on-update: true
          # Make PRs this run can't fix visible. A sweep that skips a conflicting
          # PR turns the run red, the PR gets has-conflicts, and PRs whose checks
          # are red get a warning, a summary column and the checks-failing label.
          conflict-label: has-conflicts
          fail-on-skipped-conflicts: true
          report-failing-checks: true
          failing-checks-label: checks-failing
          # Uncomment to enable conflict rebasing (force-push with lease)
          # rebase-conflicts: true
          # merge-fallback: true
          # fail-on-conflict: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
