# Uses the real auto-rebase composite action from documentation-actions.
# See https://github.com/LLazyEmail/documentation-actions/tree/main/actions/auto-rebase
name: Auto-rebase open PRs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    name: auto-rebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-rebase-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Attempt to update branches of open PRs
        uses: LLazyEmail/documentation-actions/actions/auto-rebase@main
        with:
          comment-on-update: true
          # Uncomment to enable conflict rebasing (force-push with lease)
          # rebase-conflicts: true
          # merge-fallback: true
          # fail-on-conflict: false
          # conflict-label: has-conflicts
          github-token: ${{ secrets.GITHUB_TOKEN }}
